<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Password Reset Request</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .email-container {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #dc3545;
        }
        .reset-button {
            display: inline-block;
            background: #dc3545;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 20px 0;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <h2>🔐 Password Reset Request</h2>
    </div>

    <p>You have requested to reset your password for the Curriculum Tracking System.</p>

    <div style="text-align: center;">
        <a class="reset-button" th:href="${resetUrl}">Reset Your Password</a>
    </div>

    <div class="warning">
        <strong>Security Notice:</strong> This link will expire in 1 hour. If you didn't request this reset, please
        ignore this email.
    </div>

    <p>If you need assistance, contact us at <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}"></a></p>
</div>
</body>
</html>
