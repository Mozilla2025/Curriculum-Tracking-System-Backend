spring:
  application:
    name: curriculum-tracking-system
  config:
    import: "optional:classpath:keys.properties"
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
  security:
    method:
      global-method-security:
        pre-post-enabled: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Redis Cloud Configuration
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port:10457}
      password: ${redis.password}
      database: ${redis.database}
      timeout: 5000ms
      ssl:
        enabled: ${redis.ssl.enabled:true}
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: curriculum-system

server:
  port: 8090
  servlet:
    context-path: /

app:
  jwtSecret: ${jwt.secret}
  jwtExpirationMs: ${jwt.expiration.ms}
  jwtRefreshExpirationMs: ${jwt.refresh.expiration.ms}
  admin:
    username: ${admin.username}
    email: ${admin.email}
    password: ${admin.password}
  email:
    from-name: Curriculum Tracking System
  frontend:
    url: ${frontend.url}
  password-reset:
    token-expiry-hours: 24
  cache:
    ttl:
      departments: 1800
      schools: 3600
  # Documentation Security Configuration
  docs:
    password-protection:
      enabled: true
    password: ${docs.password:SwaggerDocs@2025}
    session-timeout-hours: 24

api:
  prefix: api/v1

logging:
  level:
    com:
      mozilla:
        curriculum_tracking_system: DEBUG
    org:
      springframework:
        security: DEBUG
        orm:
          jpa: DEBUG
        transaction: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

aws:
  accessKeyId: ${aws.access.key}
  secretKey: ${aws.secret.key}
  s3:
    bucket: ${aws.bucket.name}
  region: ${aws.region.name}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    displayOperationId: false
    showExtensions: true
    showCommonExtensions: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    docExpansion: none
  show-actuator: false
  use-management-port: false
  cache:
    disabled: false