# Existing Configuration
spring.application.name=curriculum-tracking-system
server.port=8090
spring.jpa.hibernate.ddl-auto=create
server.servlet.context-path=/
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public

# JWT Configuration
app.jwtSecret=${JWT_SECRET:mySecretKey1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ}
app.jwtExpirationMs=900000
app.jwtRefreshExpirationMs=604800000
api.prefix=api/v1

